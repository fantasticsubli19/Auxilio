<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de auxilio</title>
<style>
:root{--bg:#f6f4f1;--ink:#1c1917;--muted:#6b645d;--red:#c8102e;--green:#128c4a;--line:#ddd7cf;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--red);color:#fff;padding:20px 18px 18px}
header p{margin:0;font-size:14px;opacity:.9}
header h1{margin:4px 0 0;font-size:26px;line-height:1.15}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:12px;font-size:18px;font-weight:700;color:#fff;text-decoration:none;cursor:pointer;margin-bottom:10px}
.btn.wa{background:var(--green)}
.btn.call{background:var(--ink)}
.btn.sos{background:var(--red)}
.btn:focus-visible{outline:3px solid #000;outline-offset:2px}
#status{min-height:22px;font-size:15px;color:var(--muted);margin:2px 0 14px}
.owner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-top:8px}
.owner div{padding:12px 0;border-bottom:1px solid var(--line)}
.owner div:last-child{border:0}
.owner dt{font-size:13px;color:var(--muted)}
.owner dd{margin:2px 0 0;font-size:18px;font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
.contact{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.contact span{display:block;font-size:13px;color:var(--muted)}
.contact a{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
footer{font-size:13px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<header>
  <p>Tarjeta de auxilio</p>
  <h1 id="nombre"></h1>
</header>

<main>
  <button class="btn wa" id="enviar">Enviar mi ubicación por WhatsApp</button>
  <a class="btn sos" id="emerg" href="#"></a>
  <p id="status" role="status" aria-live="polite"></p>

  <dl class="owner" id="datos"></dl>

  <h2>Contactos de emergencia</h2>
  <div id="contactos"></div>

  <footer>Al tocar el botón verde, tu teléfono pedirá permiso para compartir tu ubicación y abrirá WhatsApp con el mensaje listo. Solo tienes que pulsar enviar.</footer>
</main>

<script>
/* ====== EDITA SOLO ESTA SECCIÓN ====== */
const DUENO = {
  nombre: "Guillermo Zamna Alvarado Martínez",
  datos: [
    ["Tipo de sangre", "O+"],
    ["Alergias", "Ninguna"],
    ["Medicación", ""],
    ["Condiciones médicas", "Ácido úrico"],
    ["Seguro médico", ""]
  ],
  numeroEmergencias: "911",
  contactos: [
    { nombre: "Enrique Alvarado", tel: "525532176565" }
  ]
};
/* ====================================== */

const $ = id => document.getElementById(id);
const status = msg => { $("status").textContent = msg; };

$("nombre").textContent = DUENO.nombre;
$("emerg").textContent = "Llamar al " + DUENO.numeroEmergencias;
$("emerg").href = "tel:" + DUENO.numeroEmergencias;

$("datos").innerHTML = DUENO.datos
  .filter(([, v]) => v && v.trim())
  .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");

$("contactos").innerHTML = DUENO.contactos.map(c =>
  `<div class="contact"><div>${c.nombre}<span>+${c.tel}</span></div><a href="tel:+${c.tel}">Llamar</a></div>`
).join("");

function abrirWhatsApp(coords) {
  const principal = DUENO.contactos[0].tel;
  let texto = `🆘 EMERGENCIA: alguien escaneó la tarjeta de auxilio de ${DUENO.nombre}.`;
  if (coords) {
    const { latitude: la, longitude: lo, accuracy } = coords;
    texto += `\n📍 Ubicación: https://maps.google.com/?q=${la},${lo}\n(precisión aprox. ${Math.round(accuracy)} m)`;
  } else {
    texto += `\nNo se pudo obtener la ubicación. Por favor llama de inmediato.`;
  }
  texto += `\n🕒 ${new Date().toLocaleString("es")}`;
  status("Abriendo WhatsApp…");
  window.location.href = `https://wa.me/${principal}?text=${encodeURIComponent(texto)}`;
}

$("enviar").addEventListener("click", () => {
  if (!navigator.geolocation) { abrirWhatsApp(null); return; }
  status("Obteniendo ubicación… acepta el permiso si te lo pide.");
  navigator.geolocation.getCurrentPosition(
    pos => abrirWhatsApp(pos.coords),
    () => { status("Sin permiso de ubicación. Se enviará el aviso sin ella."); setTimeout(() => abrirWhatsApp(null), 1200); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
});
</script>
</body>
</html>
